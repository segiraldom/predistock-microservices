openapi: 3.0.3
info:
  title: "PrediStock - Microservicio de Notificaciones y Alertas"
  version: "1.0.0"
  description: |
    API del microservicio de notificaciones operativa de PrediStock. 
    Gestiona el ciclo de vida de alertas generadas ante caídas de inventario por debajo del umbral mínimo (RF09).
    
    ### Características de la Arquitectura:
    * **Stateless**: No requiere volumen de almacenamiento persistente montado en Pods.
    * **Desacoplado**: Se comunica con la base de datos relacional dedicada notifications_db.
    * **ClusterIP**: Aislado del tráfico externo directo, consumible por el API Gateway.


servers:
  - url: "http://localhost:5001/api/notifications"
    description: "Entorno local / Contenedor directo"
  - url: "http://api.predistock.local/api/notifications"
    description: "Enrutado vía API Gateway (Laravel)"


tags:
  - name: "Notificaciones"
    description: "Operaciones de consulta, registro y resolución de alertas de inventario"


paths:
  /notifications:
    get:
      tags:
        - "Notificaciones"
      summary: "Obtiene el historial de alertas del sistema"
      description: "Devuelve el listado de alertas registradas, permitiendo filtrar por bodega para alimentar la interfaz del operador."
      parameters:
        - name: "warehouse_id"
          in: "query"
          required: false
          description: "Identificador de la bodega por la cual filtrar"
          schema:
            type: "integer"
            example: 1
      responses:
        '200':
          description: "Arreglo JSON con las alertas de stock"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: '#/components/schemas/NotificationItem'


    post:
      tags:
        - "Notificaciones"
      summary: "Registro de una nueva alerta de inventario (Uso interno)"
      description: "Endpoint invocado internamente por el microservicio de Inventario cuando el stock baja de su umbral mínimo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationPayload'
      responses:
        '201':
          description: "Alerta registrada exitosamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationItem'
        '400':
          description: "Datos de la alerta incompletos o inválidos"


  /notifications/{id}/status:
    patch:
      tags:
        - "Notificaciones"
      summary: "Actualiza el estado de una alerta"
      description: "Permite marcar una alerta como atendida o descartada desde la interfaz de usuario."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Identificador numérico de la notificación"
          schema:
            type: "integer"
            example: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "status"
              properties:
                status:
                  type: "string"
                  enum: ["activa", "atendida", "descartada"]
                  example: "atendida"
      responses:
        '200':
          description: "Estado de la alerta actualizado con éxito"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationItem'
        '404':
          description: "Notificación no encontrada"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  schemas:
    NotificationItem:
      type: "object"
      properties:
        id:
          type: "integer"
          example: 15
        notification_type:
          type: "string"
          example: "LOW_STOCK_THRESHOLD"
        product_id:
          type: "integer"
          description: "Identificador del producto para redirección en frontend"
          example: 104
        warehouse_id:
          type: "integer"
          description: "Identificador de la bodega asociada"
          example: 1
        description:
          type: "string"
          example: "Nivel de stock crítico: quedan 5 unidades disponibles en Bodega Central."
        status:
          type: "string"
          enum: ["activa", "atendida", "descartada"]
          example: "atendida"
        created_at:
          type: "string"
          format: "date-time"
          example: "2026-10-17T14:22:10Z"


    CreateNotificationPayload:
      type: "object"
      required:
        - "notification_type"
        - "product_id"
        - "warehouse_id"
        - "description"
      properties:
        notification_type:
          type: "string"
          example: "LOW_STOCK_THRESHOLD"
        product_id:
          type: "integer"
          example: 104
        warehouse_id:
          type: "integer"
          example: 1
        description:
          type: "string"
          example: "Nivel de stock crítico: quedan 5 unidades disponibles en Bodega Central."


    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
          example: "NotFound"
        message:
          type: "string"
          example: "La notificación con ID 15 no existe."