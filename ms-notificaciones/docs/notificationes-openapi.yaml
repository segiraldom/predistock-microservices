openapi: 3.0.3
info:
  title: "PrediStock - Microservicio de Notificaciones y Alertas"
  version: "1.1.0"
  description: |
    API del microservicio de notificaciones operativas de PrediStock.
    Recibe eventos en tiempo real disparados por caída de stock bajo el umbral mínimo (RF09) y los retransmite a los clientes y bodegueros.

    ### Características de la Arquitectura:
    - **Stateless**: No requiere base de datos ni volumen de almacenamiento persistente montado en Pods.
    - **Desacoplado**: Actúa como un despachador de eventos (Event Dispatcher / Bridge) en tiempo real.
    - **ClusterIP**: Aislado del tráfico externo directo, consumible internamente por el microservicio de Existencias.

    ### Uso interno
    `POST /alerts` solo lo invoca ms-existencias por la red interna, sin cabeceras de identidad.
    Las peticiones que llegan por el API Gateway traen `X-Usuario-Id` / `X-Rol` y se rechazan con `403`,
    para que un usuario no pueda fabricar alertas.

    ### Errores
    Todas las respuestas de error usan el formato uniforme de PrediStock: `{"error": CODIGO, "mensaje": texto}`.
    En los errores de validación, `mensaje` es un objeto con la lista de errores de cada campo.


servers:
  - url: "http://localhost:5001/api/notifications"
    description: "Entorno local / Contenedor directo"
  - url: "http://api.predistock.local/api/notifications"
    description: "Enrutado vía API Gateway (Laravel)"


tags:
  - name: "Notificaciones"
    description: "Despacho y transmisión de alertas de existencias en tiempo real"
  - name: "Salud"
    description: "Verificación de disponibilidad del servicio"


paths:
  /alerts:
    post:
      tags:
        - "Notificaciones"
      summary: "Despacha una alerta de existencias (Uso interno)"
      description: "Endpoint invocado internamente por el microservicio de Existencias cuando el stock baja de su umbral configurado. El servicio procesa el payload y lo retransmite en tiempo real."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAlertPayload'
      responses:
        '200':
          description: "Alerta procesada y despachada exitosamente a los destinatarios"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResult'
        '400':
          description: "Estructura de la alerta inválida o incompleta, o JSON malformado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "DATOS_INVALIDOS"
                mensaje:
                  product_id: ["Este campo es obligatorio."]
                  current_stock: ["Debe ser un número mayor o igual a 0."]
        '403':
          description: "La petición llegó por el API Gateway (trae X-Usuario-Id o X-Rol); el endpoint es de uso interno"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "SIN_PERMISO"
                mensaje: "Las alertas solo pueden enviarse desde los microservicios internos."
        '405':
          description: "Método distinto de POST"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: "El cuerpo no se envió como application/json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags:
        - "Salud"
      summary: "Health check para Docker / Kubernetes"
      responses:
        '200':
          description: "El servicio está disponible"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    example: "ok"
                  servicio:
                    type: "string"
                    example: "ms-notificaciones"


components:
  schemas:
    StockAlertPayload:
      type: "object"
      required:
        - "alert_type"
        - "product_id"
        - "warehouse_id"
        - "current_stock"
        - "threshold"
        - "message"
      properties:
        alert_type:
          type: "string"
          example: "LOW_STOCK_THRESHOLD"
        product_id:
          type: "integer"
          minimum: 1
          description: "Identificador del producto afectado"
          example: 104
        warehouse_id:
          type: "integer"
          minimum: 1
          description: "Identificador de la bodega asociada"
          example: 1
        current_stock:
          type: "number"
          minimum: 0
          description: "Cantidad actual en bodega. Entero, o decimal para productos que se manejan en fracciones."
          example: 4
        threshold:
          type: "number"
          minimum: 0
          description: "Umbral mínimo configurado que detonó la alerta"
          example: 10
        message:
          type: "string"
          description: "Texto informativo de la alerta"
          example: "Stock crítico: quedan 4 unidades disponibles en Bodega Central."


    DispatchResult:
      type: "object"
      properties:
        status:
          type: "string"
          example: "delivered"
        channel:
          type: "string"
          example: "realtime_push"
        timestamp:
          type: "string"
          format: "date-time"
          example: "2026-10-24T17:25:00Z"


    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
          description: "Código del error: DATOS_INVALIDOS, SIN_PERMISO, NO_ENCONTRADO, METODO_NO_PERMITIDO, TIPO_NO_SOPORTADO o ERROR_INTERNO"
          example: "DATOS_INVALIDOS"
        mensaje:
          description: "Texto del error, o un objeto {campo: [errores]} en los errores de validación"
          oneOf:
            - type: "string"
            - type: "object"
              additionalProperties:
                type: "array"
                items:
                  type: "string"
          example: "El cuerpo no es un JSON válido."
