services:
  #API-GATEWAY: 8000
  api-gateway:
    build: ./api-gateway
    container_name: predistock-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - USUARIOS_SERVICE_URL=http://ms-usuarios:3000
      - ANALYTICS_SERVICE_URL=http://ms-analitica:5000
      - CATALOGO_SERVICE_URL=http://ms-catalogo:8001
      - EXISTENCIAS_SERVICE_URL=http://ms-existencias:8002
      - NOTIFICACIONES_SERVICE_URL=http://ms-notificaciones:5001
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - ms-usuarios
      - ms-analitica

  #MS-USUARIOS: 3000
  ms-usuarios:
    build: ./ms-usuarios
    container_name: predistock-ms-usuarios
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@autentificacion-db:5432/${AUTH_DB_NAME}
    volumes:
      - ./ms-usuarios:/app
      - /app/node_modules
    depends_on:
      autentificacion-db:
        condition: service_healthy

  autentificacion-db:
    image: postgres:15-alpine
    container_name: predistock-autentificacion-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_autentificacion_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  #MS-ANALITICA: 5000
  ms-analitica:
    build: ./ms-analitica/
    container_name: predistock-ms-analitica
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@analitica-db:5432/${ANALYTICS_DB_NAME}
      - EXISTENCIAS_SERVICE_URL=http://api-gateway:8000/api
      - JWT_SECRET=${JWT_SECRET}
      - MODELS_STORAGE_PATH=/app/models
      - FLASK_ENV=development
    volumes:
      - ./ms-analitica:/app
      - ./models_storage:/app/models
    depends_on:
      analitica-db:
        condition: service_healthy

  analitica-db:
    image: postgres:15-alpine
    container_name: predistock-analitica-db
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_analitica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ANALYTICS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  #MS-CATALOGO: 8001
  ms-catalogo:
    build: ./ms-catalogo
    container_name: predistock-ms-catalogo
    restart: unless-stopped
    # Sin "ports": solo es accesible por la red interna. El servicio confía en las cabeceras
    # X-Usuario-Id / X-Rol que pone el Gateway, así- que no debe exponerse.
    # Para probarlo directo en desarrollo, agregar temporalmente: ports: ["8001:8001"]
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql://predi_user:predi_password@catalogo-db:5432/catalogo_db
      - DJANGO_SECRET_KEY=catalogo_dev_2026
      - DJANGO_DEBUG=false
    depends_on:
      catalogo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/api/catalogo/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  catalogo-db:
    image: postgres:15-alpine
    container_name: predistock-catalogo-db
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: predi_user
      POSTGRES_PASSWORD: predi_password
    # Sin "ports": la base solo la usa ms-catalogo por la red interna.
    # Para inspeccionarla en desarrollo, agregar temporalmente: ports: ["5436:5432"]
    expose:
      - "5432"
    volumes:
      - postgres_catalogo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predi_user -d catalogo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  #MS-EXISTENCIAS: 8002
  ms-existencias:
    build: ./ms-existencias
    container_name: predistock-ms-existencias
    restart: unless-stopped
    # Sin "ports": solo es accesible por la red interna. El servicio confía en las cabeceras
    # X-Usuario-Id / X-Rol / X-Bodega-Id que pone el Gateway, así que no debe exponerse.
    # Para probarlo directo en desarrollo, agregar temporalmente: ports: ["8002:8002"]
    expose:
      - "8002"
    environment:
      - DATABASE_URL=postgresql://predi_user:predi_password@existencias-db:5432/existencias_db
      - DJANGO_SECRET_KEY=existencias_dev_2026
      - DJANGO_DEBUG=false
      - CATALOGO_SERVICE_URL=http://ms-catalogo:8001/api/catalogo
      - CATALOGO_VALIDACION=true # valida productos y proveedores contra ms-catalogo; sin datos cargados allí rechaza con 422
      - NOTIFICACIONES_SERVICE_URL=http://ms-notificaciones:5001/api/notifications
    depends_on:
      existencias-db:
        condition: service_healthy
      ms-notificaciones:
        condition: service_started # si notificaciones falla, existencias igual opera (las alertas solo se pierden)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/api/existencias/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  existencias-db:
    image: postgres:15-alpine
    container_name: predistock-existencias-db
    environment:
      POSTGRES_DB: existencias_db
      POSTGRES_USER: predi_user
      POSTGRES_PASSWORD: predi_password
    # Sin "ports": la base solo la usa ms-existencias por la red interna.
    # Para inspeccionarla en desarrollo, agregar temporalmente: ports: ["5435:5432"]
    expose:
      - "5432"
    volumes:
      - postgres_existencias_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predi_user -d existencias_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  #MS-NOTIFICACIONES: 5001
  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: predistock-ms-notificaciones
    restart: unless-stopped
    # Sin "ports" ni base de datos: solo lo llama ms-existencias por la red interna.
    # Para probarlo directo en desarrollo, agregar temporalmente: ports: ["5001:5001"]
    expose:
      - "5001"
    environment:
      - PORT=5001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/notifications/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SEEDERS (datos de demostración). Servicios de un solo uso: arrancan, siembran y terminan.
  # Son idempotentes, así que pueden correr en cada "docker compose up" sin duplicar datos.
  # Mismo comando en Windows, Linux y Kubernetes (allí serían Jobs con la misma imagen).

  seed-usuarios:
    build: ./ms-usuarios
    container_name: predistock-seed-usuarios
    command: node seed.js
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@autentificacion-db:5432/${AUTH_DB_NAME}
    depends_on:
      autentificacion-db:
        condition: service_healthy
  seed-catalogo:
    build: ./ms-catalogo
    container_name: predistock-seed-catalogo
    command: python manage.py seed_catalogo --confirmo
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://predi_user:predi_password@catalogo-db:5432/catalogo_db
      - DJANGO_SECRET_KEY=catalogo_dev_2026
      - DJANGO_DEBUG=false
    depends_on:
      ms-catalogo:
        condition: service_healthy

  seed-existencias:
    build: ./ms-existencias
    container_name: predistock-seed-existencias
    command: python manage.py seed_existencias --confirmo --solo-si-vacio
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://predi_user:predi_password@existencias-db:5432/existencias_db
      - DJANGO_SECRET_KEY=existencias_dev_2026
      - DJANGO_DEBUG=false
      - CATALOGO_SERVICE_URL=http://ms-catalogo:8001/api/catalogo
      - CATALOGO_VALIDACION=true
      - NOTIFICACIONES_SERVICE_URL=http://ms-notificaciones:5001/api/notifications
    depends_on:
      seed-catalogo:
        condition: service_completed_successfully
      ms-existencias:
        condition: service_healthy

  #FRONTEND: 5173
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GATEWAY_URL=http://localhost:8000/api
    container_name: predistock-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  # LOCUST: Pruebas de rendimiento bajo demanda (Puerto 8089)
  locust:
    build: ./performance-tests
    container_name: predistock-locust
    profiles: ["testing"]
    ports:
      - "8089:8089"
    environment:
      - LOCUST_HOST=http://api-gateway:8000
    volumes:
      - ./performance-tests:/locust
    depends_on:
      - api-gateway

volumes:
  postgres_analitica_data:
  postgres_autentificacion_data:
  postgres_catalogo_data:
  postgres_existencias_data:
  models_storage: